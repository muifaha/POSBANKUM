<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Logo Posbankum Kelurahan Mangunsari</title>
  <desc id="d">Perisai hijau berisi timbangan keadilan, di samping tulisan Posbankum Kelurahan Mangunsari.</desc>

  <!-- Lambang: perisai + timbangan keadilan -->
  <g id="lambang" transform="translate(10 0)">
    <path d="M100 8 L178 36 V102 C178 148 143 178 100 192 C57 178 22 148 22 102 V36 Z" fill="#1F5A4B"/>
    <path d="M100 18 L168 42 V102 C168 141 139 168 100 181 C61 168 32 141 32 102 V42 Z" fill="none" stroke="#C9962B" stroke-width="3"/>

    <!-- tiang dan alas -->
    <line x1="100" y1="58" x2="100" y2="138" stroke="#F7F3E8" stroke-width="6" stroke-linecap="round"/>
    <line x1="76" y1="142" x2="124" y2="142" stroke="#F7F3E8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="54" r="7" fill="#C9962B"/>

    <!-- lengan timbangan -->
    <line x1="56" y1="72" x2="144" y2="72" stroke="#F7F3E8" stroke-width="5" stroke-linecap="round"/>

    <!-- piringan kiri -->
    <line x1="56" y1="72" x2="42" y2="106" stroke="#F7F3E8" stroke-width="2.5"/>
    <line x1="56" y1="72" x2="70" y2="106" stroke="#F7F3E8" stroke-width="2.5"/>
    <path d="M38 106 H74 Q74 124 56 124 Q38 124 38 106 Z" fill="#C9962B"/>

    <!-- piringan kanan -->
    <line x1="144" y1="72" x2="130" y2="106" stroke="#F7F3E8" stroke-width="2.5"/>
    <line x1="144" y1="72" x2="158" y2="106" stroke="#F7F3E8" stroke-width="2.5"/>
    <path d="M126 106 H162 Q162 124 144 124 Q126 124 126 106 Z" fill="#C9962B"/>
  </g>

  <!-- Tulisan -->
  <text x="224" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#1F5A4B">Posbankum</text>
  <line x1="226" y1="122" x2="300" y2="122" stroke="#C9962B" stroke-width="3"/>
  <text x="224" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#3C4A45">Kelurahan Mangunsari</text>
</svg>
